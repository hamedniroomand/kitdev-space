name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A pull request cancels its older runs.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One job, in order: install, lint and check, build, test.
  # The first build is a local server that the browser tests run against.
  # Vercel deploys main on its own after a push.
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 1. Install
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun ci

      # 2. Lint and check
      - run: bun lint
      - run: bun typecheck
      - run: bun run test

name: Feature request
description: Ask for a new tool or a change to a tool.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The task that you cannot do now.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Solution
      description: The tool or the change that you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other tools or methods that you tried.

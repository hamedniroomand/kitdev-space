<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Forge Surface to Near-Black -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="55%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0a0a0e"/>
    </linearGradient>

    <!-- Outer Rim Accent -->
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.65"/>
    </linearGradient>

    <!-- Cool Core Radial Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.75"/>
      <stop offset="35%" stop-color="#818cf8" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#06b6d4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0a0a0e" stop-opacity="0"/>
    </radialGradient>

    <!-- Left Code Bracket Gradient (Light Indigo -> Brand Primary) -->
    <linearGradient id="leftBrk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Right Code Bracket Gradient (Brand Primary -> Cyan Accent) -->
    <linearGradient id="rightBrk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Primary 4-Point Star Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#eef2ff"/>
      <stop offset="60%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Star Glow Filter -->
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="106" fill="none" stroke="url(#border)" stroke-width="5"/>

  <!-- Radiant Core Glow -->
  <circle cx="256" cy="256" r="190" fill="url(#coreGlow)"/>

  <!-- Left Code Bracket < -->
  <path d="M 152 148 L 76 256 L 152 364"
        fill="none" stroke="url(#leftBrk)" stroke-width="46"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right Code Bracket > -->
  <path d="M 360 148 L 436 256 L 360 364"
        fill="none" stroke="url(#rightBrk)" stroke-width="46"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Secondary 45-degree Star Spark -->
  <path d="M 256 198 C 256 236 236 256 198 256 C 236 256 256 276 256 314 C 256 276 276 256 314 256 C 276 256 256 236 256 198 Z"
        fill="#a5b4fc" opacity="0.70" transform="rotate(45 256 256)"/>

  <!-- Primary 4-Point Cosmic Star ✦ -->
  <path d="M 256 130
           C 256 204 204 256 172 256
           C 204 256 256 308 256 382
           C 256 308 308 256 340 256
           C 308 256 256 204 256 130 Z"
        fill="url(#starGrad)" filter="url(#bloom)"/>

  <!-- Nucleus Sparkle -->
  <circle cx="256" cy="256" r="18" fill="#ffffff"/>
</svg>